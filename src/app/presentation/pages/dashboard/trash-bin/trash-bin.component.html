<div class="p-6 max-w-7xl mx-auto" (click)="closeAllMenus()">
    <!-- Encabezado -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-semibold text-gray-800">Papelera</h1>

        <!-- Botones de vista -->
        <div class="flex space-x-2">

            <button
                class="inline-flex items-center px-4 py-2 bg-red-600 text-white rounded hover:bg-red-500 cursor-pointer transition"
                (click)="emptyTrash()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5.5 w-5.5 mr-2" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M600-240v-80h160v80H600Zm0-320v-80h280v80H600Zm0 160v-80h240v80H600ZM120-640H80v-80h160v-60h160v60h160v80h-40v360q0 33-23.5 56.5T440-200H200q-33 0-56.5-23.5T120-280v-360Zm80 0v360h240v-360H200Zm0 0v360-360Z" />
                </svg>
                Vaciar papelera
            </button>

            <button class="p-2 rounded border border-gray-300 bg-white hover:bg-gray-100 transition"
                title="Buscar documento">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M200-800v241-1 400-640 200-200Zm0 720q-33 0-56.5-23.5T120-160v-640q0-33 23.5-56.5T200-880h320l240 240v100q-19-8-39-12.5t-41-6.5v-41H480v-200H200v640h241q16 24 36 44.5T521-80H200Zm460-120q42 0 71-29t29-71q0-42-29-71t-71-29q-42 0-71 29t-29 71q0 42 29 71t71 29ZM864-40 756-148q-21 14-45.5 21t-50.5 7q-75 0-127.5-52.5T480-300q0-75 52.5-127.5T660-480q75 0 127.5 52.5T840-300q0 26-7 50.5T812-204L920-96l-56 56Z" />
                </svg>
            </button>

            <button class="p-2 rounded border border-gray-300 bg-gray-100 hover:bg-gray-100 transition"
                title="Vista de lista">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                </svg>
            </button>

        </div>
    </div>

    <!-- Tabla de documentos -->
    <div class="bg-white border border-gray-200 rounded-md shadow-sm overflow-hidden">
        <!-- Cabecera de la tabla -->
        <div class="grid grid-cols-12 bg-gray-100 border-b border-gray-200">
            <div
                class="col-span-7 p-3 font-medium ml-1 text-xl text-gray-700 flex items-center border-r border-gray-300">
                Título
            </div>
            <div class="col-span-5 p-3 font-medium text-xl text-gray-700 flex items-center justify-between">
                <span class="ml-1">Modificado</span>
                <button class="p-1 hover:bg-gray-200 rounded transition"
                    title="{{ isAscendingOrder ? 'Ordenar por más reciente' : 'Ordenar por más antiguo' }}"
                    (click)="toggleSortOrder()">
                    <svg xmlns="http://www.w3.org/2000/svg" [class.transform]="!isAscendingOrder"
                        [class.rotate-180]="!isAscendingOrder" class="h-4 w-4 text-gray-600 transition-transform"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                    </svg>
                </button>
            </div>
        </div>

        @for (diagram of diagrams; track diagram.id) {
        <div class="grid grid-cols-12 border-b border-gray-200 hover:bg-gray-50 cursor-pointer transition group"
            (click)="openDiagram(diagram.type, diagram.id)"
            [class.border-b-0]="diagram === diagrams[diagrams.length - 1]">
            <div class="col-span-7 p-4 flex items-center justify-between">
                <div class="flex items-center flex-1">
                    @if (diagram.type=== 'project'){
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" viewBox="0 -960 960 960"
                        fill="currentColor">
                        <path
                            d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v400q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H447l-80-80H160v480Zm0 0v-480 480Z" />
                    </svg>
                    } @else {
                    <img src="/UMLForgeOnlyIcon.png" alt="UMLForgeIcon" class="h-5 w-5 mr-3">
                    }
                    <span class="text-gray-800">{{ diagram.title }}</span>
                </div>

                <div class="relative">
                    <button #optionsButton
                        class="p-1.5 rounded-full text-gray-400 hover:bg-gray-200 hover:text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity ml-2"
                        title="Más opciones" (click)="toggleOptionsMenu($event, diagram, optionsButton)">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z" />
                        </svg>
                    </button>
                    @if (diagram.showOptions) {
                    <app-options-menu 
                        position="right" 
                        [triggerRect]="optionsButton.getBoundingClientRect()"
                        [trashBinOptions]="true" 
                        (optionSelected)="handleOptionSelected($event, diagram)"
                        class="options-menu">
                    </app-options-menu>
                    }
                </div>
            </div>
            <div class="col-span-5 p-4 text-gray-600">
                {{ diagram.modified }}
            </div>
        </div>
        }
        @if (diagrams.length === 0) {
        <div class="p-8 text-center text-gray-500">
            No hay elementos en la papelera.
        </div>
        }
    </div>

    <!-- Paginador (solo se muestra si hay más de 8 elementos) -->
    @if (totalPages > 1) {
    <app-paginator
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [accentColor]="accentColor"
        (pageChanged)="goToPage($event)"
        class="mt-8 flex justify-center space-x-2">
    </app-paginator>
    }
</div>
