<aside class="w-52 bg-white border-r border-gray-200 flex flex-col h-full">
  <!--New document-->
  <div class="p-4">
    <button (click)="openProjectModal()"
      class="w-full text-white bg-yellow-500 hover:bg-yellow-400 focus:outline-none py-2 px-4 rounded-md flex items-center justify-center cursor-pointer">
      <span class="mr-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 mr-1.5 text-white" viewBox="0 -960 960 960"
          fill="currentColor">
          <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
        </svg>
        <!-- <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5 mr-1.5 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm1 15h-2v-4H7v-2h4V7h2v4h4v2h-4z" />
        </svg>> -->
      </span> Nuevo proyecto
    </button>
  </div>
  <!--Navigation-->
  <nav class="flex-0.5">
    <ul class="space-y-1 mb-2">
      <li>
        <a routerLink="/dashboard/home" routerLinkActive="bg-gray-200 text-gray-950 font-medium"
          class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-md mx-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Inicio
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/projects" routerLinkActive="bg-gray-200 text-gray-950 font-medium"
          class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-md mx-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          Proyectos
        </a>
      </li>
      <li>
        <a routerLink="/dashboard/trash-bin" routerLinkActive="bg-gray-200 text-gray-950 font-medium"
          class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-md mx-2">
          <!-- <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg> -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" viewBox="0 -960 960 960"
            fill="currentColor">
            <path
              d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
          </svg>
          Papelera
        </a>
      </li>
    </ul>
  </nav>

  <!--Templates-->
  <div class="p-4 border-t border-gray-200">
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Descubre</h3>
    <ul class="mt-3 space-y-1">
      <li>
        <a (click)="openDevelopmentModal('Plantillas')" routerLink="#"
          class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-md mx-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6z" />
          </svg>
          Plantillas
        </a>
      </li>
      <li>
        <a (click)="openDevelopmentModal('Integraciones')" routerLink="#"
          class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-md mx-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 text-gray-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          Integraciones
        </a>
      </li>
    </ul>
  </div>

  <div class="mt-[17rem] p-4 border-t border-gray-200">
    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Perfil</h3>
    <ul class="mt-3">
      <li>
        <a routerLink="/dashboard/user-profile" class="flex items-center hover:bg-gray-100 rounded-md p-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-700" fill="currentColor"
            viewBox="0 -960 960 960">
            <path
              d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm246-164q-59 0-99.5-40.5T340-580q0-59 40.5-99.5T480-720q59 0 99.5 40.5T620-580q0 59-40.5 99.5T480-440Zm0 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q53 0 100-15.5t86-44.5q-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160Zm0-360q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm0-60Zm0 360Z" />
          </svg>
          <span class="ml-2 text-sm text-gray-700">
            @if (userProfile) {
            {{ userProfile.fullName }}
            } @else {
            Usuario
            }
          </span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Modal de creación de proyecto -->
  @if (showProjectModal) {
  <app-project-creation (close)="closeProjectModal()" (create)="handleCreateProject($event)">
  </app-project-creation>
  }

  <!-- Modal de característica en desarrollo -->
  @if (showDevelopmentModal) {
  <app-on-development [featureName]="developmentFeatureName" (close)="closeDevelopmentModal()">
  </app-on-development>
  }
</aside>
