<div class="fixed inset-0 flex items-center justify-center z-50 modal-container">
    <!-- Fondo con efecto blur -->
    <div class="absolute inset-0 bg-black bg-opacity-30 backdrop-blur-sm modal-overlay"></div>

    <div class="bg-white w-[30rem] rounded-xl shadow-lg relative z-10 modal-content">
        <!-- Botón de cerrar -->
        <button (click)="closeModal()" [disabled]="isLoading"
            class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 bg-transparent p-1 rounded-full hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Resto del contenido del modal... -->
        <div class="p-6">
            <h1 class="font-semibold text-3xl text-gray-800">
                Nuevo proyecto
            </h1>

            <!-- Ilustración de proyecto -->
            <div class="mt-4 flex justify-center">
                <div class="p-4 rounded-full bg-yellow-100">
                    @if (isLoading) {
                    <div class="h-20 w-20 flex items-center justify-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-yellow-500"></div>
                    </div>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-yellow-500" viewBox="0 -960 960 960"
                        fill="currentColor">
                        <path
                            d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v400q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H447l-80-80H160v480Zm0 0v-480 480Z" />
                    </svg>
                    }
                </div>
            </div>

            <!-- Loading message -->
            @if (isLoading) {
            <div class="mt-4 text-center">
                <p class="text-lg font-medium text-gray-700">Creando proyecto...</p>
                <p class="text-sm text-gray-500 mt-1">Esto puede tardar unos segundos</p>
            </div>
            } @else {
            <!-- Formulario para el nombre del proyecto -->
            <div class="mt-6">
                <label for="projectName" class="block text-lg font-semibold text-gray-700">
                    Nombre del proyecto:
                </label>
                <input type="text" id="projectName" [(ngModel)]="projectName" (input)="clearError()" (keypress)="onKeyPress($event)"
                    placeholder="Ingresa un nombre para tu proyecto..."
                    class="mt-2 w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                    [disabled]="isLoading" />
                @if (errorMessage) {
                <p class="mt-2 text-red-600 text-sm">{{ errorMessage }}</p>
                }
            </div>

            <!-- Información adicional -->
            <div class="mt-4 p-4 bg-blue-50 rounded-lg">
                <div class="flex items-start">
                    <div class="flex-shrink-0 mt-0.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-700" viewBox="0 -960 960 960"
                            fill="currentColor">
                            <path
                                d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
                        </svg>
                    </div>
                    <p class="ml-3 text text-justify font-medium text-blue-700">
                        En este proyecto podrás crear diferentes tipos de diagramas UML y organizarlos fácilmente.
                    </p>
                </div>
            </div>
            }

            <!-- Botones de acción -->
            <div class="flex justify-end space-x-3 mt-8">
                <button (click)="closeModal()" [disabled]="isLoading"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Cancelar
                </button>
                <button (click)="createProject()" [disabled]="!isValidProjectName() || isLoading"
                    class="px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-400 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
                    @if (isLoading) {
                    <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
                    <span>Creando...</span>
                    } @else {
                    <span>Crear proyecto</span>
                    }
                </button>
            </div>
        </div>
    </div>
</div>
