<div class="menu-container">
    <div class="menu-overlay" (click)="selectOption('close')"></div>
    <div #menuContent class="menu-content">
        <div class="py-1">
            <!-- Opciones normales cuando NO estamos en la papelera -->
            @if (!trashBinOptions) {
            <!-- Abrir -->
            <button (click)="selectOption('open')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z" />
                </svg>
                Abrir
            </button>

            <!-- Renombrar -->
            <button (click)="selectOption('rename')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
                </svg>
                Renombrar
            </button>

            <!-- Mover a la papelera -->
            <button (click)="selectOption('trash')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
                </svg>
                Mover a la papelera
            </button>

            <div class="border-t-2 border-gray-200 my-1"></div>

            <!-- Mostrar detalles -->
            <button (click)="selectOption('details')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="m298-262-56-56 121-122H80v-80h283L242-642l56-56 218 218-218 218Zm222-18v-80h360v80H520Zm0-320v-80h360v80H520Zm120 160v-80h240v80H640Z" />
                </svg>
                Mostrar detalles
            </button>
            }

            <!-- Opciones especiales para la papelera -->
            @if (trashBinOptions) {
            <!-- Restaurar -->
            <button (click)="selectOption('restore')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="M440-320h80v-166l64 62 56-56-160-160-160 160 56 56 64-62v166ZM280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z" />
                </svg>
                Restaurar
            </button>

            <!-- Eliminar permanentemente -->
            <button (click)="selectOption('delete')"
                class="w-full text-left px-4 py-2 text-sm text-red-700 hover:bg-gray-100 hover:text-red-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-red-700 hover:text-red-900" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="m376-300 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 180q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520Zm-400 0v520-520Z" />
                </svg>
                Eliminar
            </button>

            <!-- <div class="border-t-2 border-gray-200 my-1"></div> -->

            <!-- Mostrar detalles -->
            <!-- <button (click)="selectOption('details')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900 flex items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" viewBox="0 -960 960 960"
                    fill="currentColor">
                    <path
                        d="m298-262-56-56 121-122H80v-80h283L242-642l56-56 218 218-218 218Zm222-18v-80h360v80H520Zm0-320v-80h360v80H520Zm120 160v-80h240v80H640Z" />
                </svg>
                Mostrar detalles
            </button> -->
            }
        </div>
    </div>
</div>
